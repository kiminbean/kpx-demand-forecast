services:
  - type: web
    name: jref-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements_api.txt
    startCommand: python run_api.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
    healthCheckPath: /health
    autoDeploy: true
